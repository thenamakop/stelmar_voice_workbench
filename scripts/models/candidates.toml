[[candidate]]
id = "hinglish"
repo = "Trelis/whisper-hinglish-preview"
revision = "eab1188fd2d0e91f2584229b32b3bfe1901c896c"
base = "large-v3"
languages = ["hi", "en"]
candidate_roles = ["rolling", "night", "live"]
licence = "Apache-2.0"
licence_evidence = "Hugging Face model card metadata (license: apache-2.0), read 8 Nov 2026"
not_independent_on = ["fleurs-hi"]
independence_unknown_on = ["coshe-eval"]
training_data_evidence = """Model card (read 9 Nov 2026): names no training data, only the starting checkpoint \
ARTPARK-IISc/whisper-large-v3-vaani-hindi (a Vaani-fine-tuned large-v3, whose Vaani family lists FLEURS in training: \
fleurs-hi is marked not independent to be safe). CoSHE appears on the card only as an evaluation benchmark \
(CoSHE-500, derived from soketlabs/CoSHE-Eval, which Trelis asks people not to train on); the card does not say \
whether CoSHE-Eval or its source recordings were used for this model, so coshe-eval is independence unknown."""
notes = "Code-switching fine-tune; uses a <|mixedcode|> token after the language token. Check it after conversion."
special_tokens = ["<|mixedcode|>"]
# n_vocab is 51867: <|mixedcode|> was appended as id 51866 after the standard large-v3 vocabulary.
# whisper.cpp derives special-token ids from n_vocab and would shift them all by one, so the
# converter also writes a copy without that last embedding row (the raw conversion is kept as
# ggml-hinglish-raw-f16.bin to show the difference). Evaluated through --file only if its output
# is still correct (Phase 5 If Blocked); D14's code-switch token is not available in whisper.cpp.
truncate_vocab_to = 51866
