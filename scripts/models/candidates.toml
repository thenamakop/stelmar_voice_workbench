# Candidate fine-tunes for conversion to whisper.cpp ggml (docs/PLAN.md section 5, models/README.md).
# convert_hf_whisper.py reads this file; quantize_models.py writes models/manifest.local.json.
# Licence rule (AGENTS.md): MIT, Apache 2.0, BSD or ISC only; anything else is dropped and recorded.
# `revision` pins the Hugging Face commit read on 8 November 2026; `sha256` pins a plain-URL archive.
#
# independence_unknown_on: sets the sources neither confirm nor rule out as training data; treated like
# not_independent_on for ranking, but reported as "unknown".
# not_independent_on: evaluation sets whose training split (or a sibling split of the same corpus)
# the model was trained on. Its numbers on those sets are reported but marked "not independent" in
# every summary and table, and Phase 5 never ranks on them. training_data_evidence says where this
# was read; "unverified" means the source does not say and the set is marked to be safe.

