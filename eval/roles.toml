# Decoding settings per role (docs/PLAN.md section 6). The harness passes them to the engine exactly,
# so evaluation numbers match the app. Thread counts here are for evaluation runs on the Legion; on
# the room machines they come from capability.json, never from this file.
#
# glossary: Phase 5 fills it (STELMAR, BML Munjal University, speaker names, track keywords, Latin
# script) and tests it on the local sets; it stays empty for the public sets, whose vocabulary it
# does not cover.
#
# timestamps = false everywhere: segment times come from the audio clock and VAD, never from model
# timestamps (PLAN section 5), and fine-tunes trained without timestamp tokens (vasista22) hallucinate
# when decoded with them (found in Phase 5a: hindi-small 67.8% WER with timestamps on FLEURS hi).

[near-live]
timestamps = false
beam_size = 1                # greedy
best_of = 1
temperature_fallback = false
previous_text_context = false
vad = true
max_chunk_s = 15.0           # one VAD utterance
threads = 8

[rolling]
timestamps = false
beam_size = 5
best_of = 5
temperature_fallback = true
previous_text_context = true  # previous segment in the same language
vad = true
max_chunk_s = 15.0            # sentence-sized chunks in multi-language sessions (30 s otherwise)
threads = 8

[night]
timestamps = false
beam_size = 5
best_of = 5
temperature_fallback = true
previous_text_context = true
vad = true
max_chunk_s = 15.0
threads = 8

[live]
timestamps = false
beam_size = 5                 # finals; partials are greedy
best_of = 5
temperature_fallback = true
previous_text_context = true
vad = true
max_chunk_s = 25.0
threads = 8

# Parity with whisper-cli (Phase 2): the rolling settings without previous-text context. whisper-cli
# takes the context as a --prompt command-line argument, and on Windows its ANSI command line turns every
# Devanagari or Arabic-script character of the prompt into "?" (found 10 Nov 2026), after which the model
# decodes garbage ("??? ??? ???"). Context can therefore not be compared through whisper-cli for Hindi or
# Urdu; this role switches it off on both sides so that the decoding itself is compared.
[parity]
timestamps = false
beam_size = 5
best_of = 5
temperature_fallback = true
previous_text_context = false
vad = true
max_chunk_s = 15.0
threads = 8

# The 30 s variants of rolling and night for SINGLE-language sessions (PLAN section 6 allows 30 s there; the 15 s
# role limits are for sessions with several languages, where sentence-sized chunks keep detection per sentence).
# A 15 s cap splits a long single-language sentence where there may be no pause (the FLEURS Hindi clips of 22 s:
# stock medium 47.5 -> 51.7 WER, hindi-medium 18.5 -> 23.9 against whole-clip decoding, Phase 5a). Used by the
# chunk-cap control in runs.toml; label every result with its role.
[rolling-30]
timestamps = false
beam_size = 5
best_of = 5
temperature_fallback = true
previous_text_context = true
vad = true
max_chunk_s = 30.0
threads = 8

[night-30]
timestamps = false
beam_size = 5
best_of = 5
temperature_fallback = true
previous_text_context = true
vad = true
max_chunk_s = 30.0
threads = 8
