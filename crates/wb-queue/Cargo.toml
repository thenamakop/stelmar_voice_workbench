[package]
name = "wb-queue"
description = "The post-processing queue's logic: jobs and units in SQLite, the revision writer, in-order commit, scheduling rules, estimates, the night plan and session import (STELMAR Voice Workbench)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
