[package]
name = "wb-engine-core"
description = "The speech engine's decisions that need no model: chunking at VAD pauses, per-chunk language choice, guards, scripts and UTF-8 (STELMAR Voice Workbench)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Development only (Phase 5, items 4 and 5): experiments with the per-chunk language rule, read from an environment variable.
# Never in a release engine: scripts/build-engines.ps1 builds it only with -LangExperiments, under another file name, and
# scripts/check-engine-no-experiments.ps1 proves that no shipped engine contains the switch.
lang-experiments = []

[dependencies]
# DEFLATE for the compression-ratio guard (PLAN section 6); pure Rust backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wb-protocol.workspace = true

[lints]
workspace = true
