[package]
name = "stelmar-voice-workbench"
description = "STELMAR Voice Workbench: offline session recorder and transcriber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (cargo issue 8519 on Windows).
name = "stelmar_voice_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Development and gate runs only: environment variables start, resume, stop and stress a session
# without the UI (docs/GATES.md runs). build.rs refuses it in the release profile, so it can never
# reach an installer; gate builds use `cargo build --profile gate --features gate-hooks`.
gate-hooks = ["wb-machine/emulation"]
# Serve the built UI from dist/ instead of the dev server, for builds made with plain cargo
# (`pnpm tauri build` turns on tauri/custom-protocol itself).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to Tauri 2.11.x (AGENTS.md stack). No Tauri plugins: no HTTP, updater, shell or opener.
tauri = { version = "~2.11", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wb-machine.workspace = true
wb-models.workspace = true
wb-protocol.workspace = true
wb-recorder.workspace = true
wb-supervisor.workspace = true
# Same version Tauri uses; only to size the async runtime from the affinity mask.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's WebView2 backend (wry), for the ProcessFailed handler.
webview2-com = "0.38"
windows = { workspace = true, features = ["std", "Win32_Foundation"] }

[lints]
workspace = true
